name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme AdmobKit \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -quiet

      # The package ships in Swift 5 language mode so that new concurrency
      # annotations in GoogleMobileAds 13.x minors never break consuming apps.
      # This step surfaces them early instead.
      - name: Build for iOS (Swift 6 strict concurrency)
        run: |
          xcodebuild build \
            -scheme AdmobKit \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -quiet \
            SWIFT_VERSION=6 \
            SWIFT_STRICT_CONCURRENCY=complete

      - name: Test
        run: |
          xcodebuild test \
            -scheme AdmobKit \
            -destination "$(bash scripts/simulator-destination.sh)" \
            -skipPackagePluginValidation \
            -quiet

      # Keeps the reference integration compiling against the current public API.
      - name: Build example app
        working-directory: Examples/AdmobKitDemo.swiftpm
        run: |
          xcodebuild build \
            -scheme AdmobKitDemo \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -quiet
