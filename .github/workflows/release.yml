name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build -c release -v

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## AdmobKit ${{ github.ref_name }}
            
            ### Installation
            
            Add to your `Package.swift`:
            ```swift
            dependencies: [
                .package(url: "https://github.com/Kirade/AdmobKit.git", from: "${{ steps.version.outputs.VERSION }}")
            ]
            ```
            
            Or in Xcode: File → Add Package Dependencies → `https://github.com/Kirade/AdmobKit.git`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
