name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme AdmobKit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -skipPackagePluginValidation \
            -quiet

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## AdmobKit ${{ github.ref_name }}

            ### Installation

            Add to your `Package.swift`:
            ```swift
            dependencies: [
                .package(url: "https://github.com/Kirade/AdmobKit.git", from: "${{ steps.version.outputs.VERSION }}")
            ]
            ```

            Or in Xcode: File → Add Package Dependencies → `https://github.com/Kirade/AdmobKit.git`
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
